[buffer]
pool_size = 256

[storage]
data_dir = "/var/lib/chusql"
log_files = "/var/log/chusql"
[server]
worker_threads = 2
max_concurrent_queries = 2
max_connections = 32
connection_idle = 300
transaction_idle = 60
transaction_max = 300
listen_host = "0.0.0.0"
port = 7777
max_message = 1048576
max_rows = 1000
sudo_auth_user = ""
