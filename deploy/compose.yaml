name: chublog
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend-build: &backend-build
  context: ..
  dockerfile: deploy/Dockerfile
  args: &backend-build-args
    DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.tencentyun.com}
    DEBIAN_IMAGE: ${REGISTRY_PREFIX-mirror.ccs.tencentyun.com/library/}debian:trixie-slim
    RUST_IMAGE: ${REGISTRY_PREFIX-mirror.ccs.tencentyun.com/library/}rust:1-trixie
    HASKELL_IMAGE: ${REGISTRY_PREFIX-mirror.ccs.tencentyun.com/library/}haskell:9.10.3-slim-bookworm
    CARGO_MIRROR_INDEX: ${CARGO_MIRROR_INDEX-sparse+https://rsproxy.cn/index/}
services:
  init:
    build: { <<: *backend-build, target: init }
    volumes:
      - content:/data
      - ingress:/srv/ingress
      - database:/db-data
      - db-logs:/db-logs
    restart: "no"
    network_mode: none
    logging: *logging
  api:
    init: true
    build: { <<: *backend-build, target: api }
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      CHUSQL_ADDRESS: db:7777
      CHUSQL_USER: chublog_index
      CHUSQL_PASSWORD: ${CHUSQL_PASSWORD:?Set CHUSQL_PASSWORD}
      CHUSQL_DATABASE: chublog
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - content:/data
      - ingress:/srv/ingress
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3001/api/health]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging
  web:
    ports: ["127.0.0.1:${WEB_PORT:-1741}:${WEB_PORT:-1741}"]
    build:
      context: ../apps/web
      args:
        NODE_IMAGE: ${REGISTRY_PREFIX-mirror.ccs.tencentyun.com/library/}node:24-bookworm-slim
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirrors.tencentyun.com/npm/}
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_BASE_URL: http://api:3001
      PORT: ${WEB_PORT:-1741}
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    networks: [backend, web-entry]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging
  db:
    build:
      <<: *backend-build
      target: ${CHUSQL_BUILD_TARGET:-database}
      network: host
      args:
        <<: *backend-build-args
        CHUSQL_WITH_CLI: ${CHUSQL_WITH_CLI:-false}
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      CHUSQL_ROOT_PASSWORD: ${CHUSQL_ROOT_PASSWORD:?Set CHUSQL_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/chusql
      - db-logs:/var/log/chusql
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks: [backend]
    restart: unless-stopped
    logging: *logging
  db-init:
    build: { <<: *backend-build, target: api }
    profiles: [setup]
    entrypoint: [chublog-api, provision-db]
    environment:
      CHUSQL_ADDRESS: db:7777
      CHUSQL_ROOT_PASSWORD: ${CHUSQL_ROOT_PASSWORD:?Set CHUSQL_ROOT_PASSWORD}
      CHUSQL_PASSWORD: ${CHUSQL_PASSWORD:?Set CHUSQL_PASSWORD}
    depends_on: [db]
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: "no"
    logging: *logging

networks:
  backend: { internal: true }
  web-entry: {}
volumes:
  content: {}
  ingress: {}
  database: {}
  db-logs: {}
